<!DOCTYPE html>
<html>
<head>
    <title>Redirecting to Driver 360...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f7f9; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #1e293b; margin-top: 20px; }
        p { color: #64748b; }
        .btn { margin-top: 20px; padding: 12px 24px; background: #6366f1; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Payment Successful!</h2>
    <p>Opening Driver 360 app...</p>
    <a href="driver360://billing" class="btn">Return to App</a>

    <script>
        // Automatically try to open the app
        window.location.href = "driver360://billing";
        // Fallback for some browsers
        setTimeout(function() {
            window.location.href = "driver360://billing";
        }, 500);
    </script>
</body>
</html>
